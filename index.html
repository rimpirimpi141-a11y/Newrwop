<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: background 0.4s, color 0.4s;
      padding: 20px;
    }
    body.light { background: #f0f2f5; color: #111; }
    body.dark { background: #0a0a0f; color: #fff; }

    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub { opacity: 0.7; margin-bottom: 30px; font-size: 14px; }

    .counter {
      font-size: 80px;
      font-weight: 900;
      margin: 20px 0;
    }

    .btns { display: flex; gap: 12px; justify-content: center; margin-bottom: 30px; }
    .btns button {
      padding: 12px 28px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.3);
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      background: rgba(255,255,255,0.15);
      color: inherit;
      backdrop-filter: blur(10px);
      transition: transform 0.2s, background 0.2s;
    }
    .btns button:hover { transform: translateY(-2px); background: rgba(255,255,255,0.25); }

    .toggle {
      position: fixed; top: 20px; right: 20px;
      padding: 10px 20px; border-radius: 20px; border: none;
      cursor: pointer; font-weight: 700;
      background: rgba(255,255,255,0.2);
      color: inherit;
      backdrop-filter: blur(10px);
    }

    .features { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .card {
      padding: 16px 24px; border-radius: 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      font-weight: 600; font-size: 14px;
    }
  </style>
</head>
<body class="dark">
  <button class="toggle" onclick="document.body.classList.toggle('light'); document.body.classList.toggle('dark');">
    Toggle Mode
  </button>

  <div class="glass">
    <h1>Ekdum Mast UI</h1>
    <p class="sub">Single File | Glassmorphism | Vercel Ready</p>

    <div class="counter" id="count">0</div>

    <div class="btns">
      <button onclick="change(-1)">−</button>
      <button onclick="reset()">Reset</button>
      <button onclick="change(1)">+</button>
    </div>

    <div class="features">
      <div class="card">⚡ Fast</div>
      <div class="card">🎨 Beautiful</div>
      <div class="card">📱 Responsive</div>
    </div>
  </div>

  <script>
    let count = 0;
    const el = document.getElementById('count');
    function change(n) { count += n; el.textContent = count; }
    function reset() { count = 0; el.textContent = count; }
  </script>
</body>
</html>
